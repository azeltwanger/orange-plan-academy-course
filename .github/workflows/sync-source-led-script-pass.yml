name: Retire obsolete Academy files with verified Git recovery
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [course-member-deliverables-20260908-ec021e3]
permissions:
  contents: write
concurrency:
  group: academy-source-led-script-pass
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'course-source-led-script-pass-20260908'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      TARGET_BRANCH: course-source-led-script-pass-20260908
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Clean obsolete files and verify preservation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python tools/_cleanup_course_repo.py
          python tools/guided_course.py build
          python tools/guided_course.py check
          python tools/guided_course.py test
          python -m unittest discover -s tests -p test_member_deliverables.py -v
          python tools/guided_course.py history
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path.cwd(); r=json.loads((root/'production/repository-cleanup.json').read_text())
          deleted=set(filter(None,subprocess.check_output(['git','diff','--name-only','--diff-filter=D','HEAD'],text=True).splitlines()))
          assert deleted=={x['path'] for x in r['retired_files']}|{'tools/_cleanup_course_repo.py'},'Unexpected deletion scope'
          assert not (root/'.github/workflows/sync-source-led-script-pass.yml').exists()
          assert 'contents: read' in (root/'.github/workflows/verify-course.yml').read_text()
          assert 'contents: write' not in (root/'.github/workflows/verify-course.yml').read_text()
          print('Verified deletion scope:',len(deleted),'files; no retained writer workflow.')
          PY
      - name: Commit verified cleanup to dedicated course branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Remove obsolete course versions and retire one-shot workflows; retain verified source history'
          cat > "$RUNNER_TEMP/academy-askpass.sh" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/academy-askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/academy-askpass.sh"
          export GIT_TERMINAL_PROMPT=0
          trap 'rm -f "$RUNNER_TEMP/academy-askpass.sh"' EXIT
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          python tools/guided_course.py check
          python tools/guided_course.py history
          git diff --exit-code
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
