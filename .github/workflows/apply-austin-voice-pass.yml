name: Apply Austin dictation voice pass

on:
  push:
    branches:
      - course-austin-voice-research-final
    paths:
      - voice-final/RUN-APPLY

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: course-austin-voice-research-final
          fetch-depth: 0

      - name: Apply preflights
        run: |
          python3 voice-final/preflight.py
          python3 voice-final/verification_preflight.py

      - name: Apply Austin voice and F20 changes
        run: |
          python3 voice-final/apply.py
          python3 voice-final/master_voice_patch.py
          python3 voice-final/final_phrase_patch.py

      - name: Regenerate all dependent course layers
        run: |
          python3 tools/build-module-gates.py
          python3 tools/build-scripts.py
          python3 tools/build-scripts.py --advanced
          python3 tools/split-modules.py
          python3 tools/split-modules.py --advanced
          python3 tools/build-onefile.py
          python3 tools/build-circle-structure.py
          python3 tools/build-dictation-order.py
          python3 tools/build-film-order.py
          python3 tools/build-shoot-list.py
          python3 tools/build-production-checklist.py
          python3 tools/course-metrics.py

      - name: Verify final voice pass
        run: python3 voice-final/verify.py

      - name: Remove one-time runners
        run: |
          rm -rf voice-final
          rm -f .github/workflows/austin-voice-final-scan.yml
          rm -f .github/workflows/apply-austin-voice-pass.yml

      - name: Commit final Austin voice pass
        run: |
          git config user.name "OpenAI Austin Voice Pass"
          git config user.email "noreply@openai.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Calibrate course scripts to Austin dictation voice"
          git push origin HEAD:course-austin-voice-research-final
