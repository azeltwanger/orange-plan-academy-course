name: One-time pre-review lock

on:
  push:
    branches:
      - course-repair/app-match-voice-pass
    paths:
      - tools/apply_pre_review_lock.py
      - tools/build-dictation-order.py
      - .github/workflows/one-time-pre-review-lock.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the review branch
        uses: actions/checkout@v4
        with:
          ref: course-repair/app-match-voice-pass
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply the review lock
        run: |
          python tools/apply_pre_review_lock.py
          python tools/build-dictation-order.py
          python tools/voice_lint.py --strict-warnings
          python tools/run_all_audits.py

      - name: Remove the one-time runner and commit the result
        run: |
          rm .github/workflows/one-time-pre-review-lock.yml
          rm tools/apply_pre_review_lock.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "course: lock Core scripts and packet for Austin review"
          git push origin HEAD:course-repair/app-match-voice-pass
