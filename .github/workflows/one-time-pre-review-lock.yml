name: One-time pre-review lock

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the review branch
        uses: actions/checkout@v4
        with:
          ref: course-repair/app-match-voice-pass
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply the review lock
        run: |
          python tools/apply_pre_review_lock.py
          python - <<'PY'
          from pathlib import Path
          from tools.voice_lint import WORD, clean_sentences, spoken_text

          root = Path('.')
          custody = root / 'scripts/08-2_split-access-dual-control-and-redundancy.md'
          text = custody.read_text(encoding='utf-8')
          old = 'The operating exchange balance follows the provider\'s claim process.'
          new = 'In our demo, the operating exchange balance follows the provider\'s claim process.'
          if text.count(old) != 1:
              raise RuntimeError(f'Expected one 8.2 demo anchor, found {text.count(old)}')
          custody.write_text(text.replace(old, new, 1), encoding='utf-8')

          income = root / 'scripts/06-1_your-spending-income-floor-gap-and-bridg.md'
          for sentence in clean_sentences(spoken_text(income.read_text(encoding='utf-8'))):
              count = len(WORD.findall(sentence))
              if count > 45:
                  print(f'LONG SENTENCE ({count} words): {sentence}')
          PY
          python tools/build-dictation-order.py
          python tools/voice_lint.py --strict-warnings
          python tools/run_all_audits.py

      - name: Remove the one-time runner and commit the result
        run: |
          rm .github/workflows/one-time-pre-review-lock.yml
          rm tools/apply_pre_review_lock.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "course: lock Core scripts and packet for Austin review"
          git push origin HEAD:course-repair/app-match-voice-pass
