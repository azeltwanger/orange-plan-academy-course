name: Final Academy direct-language correction once

on:
  push:
    branches:
      - course-final-direct-language-sweep
    paths:
      - .final-language-trigger

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONPYCACHEPREFIX: /tmp/orange-plan-academy-final-language-pycache

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: course-final-direct-language-sweep
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply human-reviewed direct-language corrections
        run: |
          set -euo pipefail
          python3 tools/apply-final-direct-language-sweep.py

      - name: Regenerate every derived Academy layer
        run: |
          set -euo pipefail
          python3 tools/rebuild-masters-from-scripts.py
          python3 tools/write-v1-claim-registry.py
          python3 tools/sync-lesson-text.py
          python3 tools/build-module-gates.py
          python3 tools/split-modules.py
          python3 tools/split-modules.py --advanced
          python3 tools/build-onefile.py
          python3 tools/build-dictation-order.py
          python3 tools/build-film-order.py
          python3 tools/build-shoot-list.py
          python3 tools/write-production-checklist-template.py
          python3 tools/build-production-checklist.py
          python3 tools/build-circle-structure.py
          python3 tools/direct-voice-audit.py --fail-ordinary
          python3 tools/course-metrics.py
          python3 tools/full-language-sweep.py

      - name: Record the exhaustive review in finalization status
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('FINALIZATION-STATUS.md')
          text = p.read_text(encoding='utf-8')
          old = '- The direct-voice audit now catches same-sentence and cross-sentence “not A, but B” copywriting structures. Reviewed ordinary candidates were rewritten around the affirmative fact; necessary safety, legal, tax, and custody boundaries remain.'
          new = '- Every canonical core and Advanced lesson was included in an exhaustive 52-lesson language inventory. Ordinary negative setup and copywriting reversals were rewritten around the affirmative fact; necessary safety, legal, tax, model, and custody boundaries remain direct.'
          if text.count(old) != 1:
              raise SystemExit('expected finalization-status language bullet once')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify the requested Reserve wording and removed setup
        run: |
          set -euo pipefail
          grep -Fq -- 'This is the monthly amount your household could run on during a stressful or unexpected situation, like:' scripts/02-1_find-the-surplus-your-plan-can-actually-use.md
          grep -Fq -- 'Bitcoin going through a major drawdown at the same time a car repair, medical bill, or another large one-time expense comes up.' scripts/02-1_find-the-surplus-your-plan-can-actually-use.md
          grep -Fq -- 'Treat retirement contributions as a use of the surplus.' scripts/02-1_find-the-surplus-your-plan-can-actually-use.md
          grep -Fq -- 'Lessons scanned: **52**' FULL-LANGUAGE-SWEEP.md
          ! grep -Fq -- 'The first college-planning question is not which account to open.' scripts/02-4_optional-decide-how-much-college-help-you-are-funding.md
          ! grep -Fq -- 'The important test for a hardware wallet is not whether you wrote the recovery words down.' scripts/07-2_set-up-a-hardware-wallet-and-prove-recovery.md
          ! grep -Fq -- 'Most Bitcoin losses are not somebody breaking the cryptography.' scripts/07-3_fix-single-points-of-failure-and-harden-accounts.md

      - name: Verify the complete 52-lesson course
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/rebuild-masters-from-scripts.py \
            tools/sync-lesson-text.py \
            tools/direct-voice-audit.py \
            tools/check-v1-course-alignment.py \
            tools/write-v1-claim-registry.py \
            tools/write-production-checklist-template.py \
            tools/build-dictation-order.py \
            tools/build-shoot-list.py \
            tools/course-metrics.py
          python3 tools/check-v1-course-alignment.py
          python3 tools/check-crossrefs.py
          python3 tools/check-visuals.py
          python3 tools/check-layer-parity.py -v
          python3 tools/cold-read-audit.py
          python3 tools/course-metrics.py --check
          git diff --check
          test "$(find scripts -maxdepth 1 -type f -name '*.md' ! -name 'README.md' ! -name 'VOICE-GUIDE.md' | wc -l)" -eq 38
          test "$(find scripts/advanced -maxdepth 1 -type f -name 'A*.md' | wc -l)" -eq 14

      - name: Remove temporary audit transport and commit verified course
        run: |
          set -euo pipefail
          rm -f .final-language-trigger
          rm -f .github/workflows/final-language-sweep-once.yml
          rm -f tools/apply-final-direct-language-sweep.py
          rm -f tools/full-language-sweep.py
          rm -f FULL-LANGUAGE-SWEEP.md
          if find . -type d -name __pycache__ -o -type f -name '*.pyc' | grep -q .; then
            echo 'Python cache artifacts remain.' >&2
            exit 1
          fi
          git config user.name 'OpenAI Course Audit'
          git config user.email 'noreply@openai.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No final course changes to commit.' >&2; exit 1; }
          git commit -m 'Finalize direct language across all 52 Academy lessons'
          git push origin HEAD:course-final-direct-language-sweep
