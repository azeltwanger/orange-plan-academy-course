name: Austin dictation voice audit

on:
  push:
    branches:
      - course-austin-voice-pass-2026-08-26
    paths:
      - course-voice-pass/RUN-SCAN

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: course-austin-voice-pass-2026-08-26
          fetch-depth: 0

      - name: Scan spoken scripts against Austin dictation
        run: python3 course-voice-pass/scan.py

      - name: Commit audit report
        run: |
          git config user.name "OpenAI Voice Audit"
          git config user.email "noreply@openai.com"
          git add AUSTIN-DICTATION-VOICE-AUDIT.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Audit scripts against Austin dictation voice"
          git push origin HEAD:course-austin-voice-pass-2026-08-26
