name: Final course consistency pass

on:
  push:
    branches:
      - course-slide-deck-flow-reset
    paths:
      - .final-course-touchup-trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: course-slide-deck-flow-reset
          fetch-depth: 0
      - name: Apply final consistency pass
        run: python3 final-course-touchup.py
      - name: Normalize touched Markdown
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('PROFESSIONAL-RESEARCH-VERIFICATION.md')
          lines = [line.rstrip() for line in path.read_text(encoding='utf-8').splitlines()]
          path.write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8')
          PY
      - name: Verify final course
        run: |
          python3 - <<'PY'
          from pathlib import Path

          required = [
              'FINALIZATION-STATUS.md',
              'DICTATION-ORDER.md',
              'FILM-ORDER.md',
              'SCREEN-SHOOT-LIST.md',
              'MASTER-COURSE.md',
              'MASTER-ADVANCED.md',
              'ADVANCED-DICTATION-AUDIT.md',
              'ADVANCED-GATE-APPROVAL.md',
              'COURSE-REBUILD-REPORT.md',
          ]
          for name in required:
              path = Path(name)
              assert path.exists() and path.stat().st_size > 100, name

          core_teach = []
          captures = []
          for path in Path('scripts').glob('*.md'):
              if path.name in {'README.md', 'VOICE-GUIDE.md'}:
                  continue
              if 'WALKTHROUGH' in path.name or 'DEMO' in path.name:
                  captures.append(path)
              else:
                  core_teach.append(path)
          advanced = list(Path('scripts/advanced').glob('*.md'))
          assert len(core_teach) == 28, len(core_teach)
          assert len(captures) == 10, len(captures)
          assert len(advanced) == 14, len(advanced)

          active_files = [
              Path('README.md'), Path('FINALIZATION-STATUS.md'), Path('MASTER-COURSE.md'),
              Path('MASTER-ADVANCED.md'), Path('ALL-SCRIPTS.md'), Path('DICTATION-ORDER.md'),
              Path('FILM-ORDER.md'), Path('SCREEN-SHOOT-LIST.md'), Path('PRODUCTION-CHECKLIST.md'),
              Path('FILMING-CHECKLIST.md'), Path('MODULE-CHECKPOINTS.md'), Path('CIRCLE-STRUCTURE.md'),
              Path('COURSE-REBUILD-REPORT.md'), Path('AUSTIN-AUTHORITY.md'),
              Path('SLIDE-DECK-AUTHORITY.md'), Path('DICTATION-SOURCE-MAP.md'),
              Path('CLAIM-REGISTRY.md'), Path('COLLEGE-FUNDING-AUTHORITY.md'),
              Path('ADVANCED-DICTATION-ORDER.md'), Path('ADVANCED-DICTATION-AUDIT.md'),
              Path('ADVANCED-GATE-APPROVAL.md'), Path('PROFESSIONAL-RESEARCH-VERIFICATION.md'),
              Path('TARGETED-PROFESSIONAL-SIGNOFF.md'), Path('SOURCE-MATERIAL-POLICY.md'),
          ]
          active_files += list(Path('scripts').rglob('*.md'))
          active_files += list(Path('lesson-text').rglob('*.md'))
          active_files += list(Path('modules').rglob('*.md'))
          active = '\n'.join(p.read_text(encoding='utf-8') for p in active_files if p.exists())

          forbidden = [
              'Update holdings / Update transactions',
              'Update holdings / transactions',
              'you do that multiplication, not the app',
              'Debt comes before Allocation',
              'F22 remains the only',
              'A3.2 · The four ways debt',
              'A4.1 · The price context',
              'SLOP-ACCEPTED.md',
              '== YOUR DECISION ==',
              '== PUT IT IN ORANGE PLAN ==',
              '== YOU ARE DONE WHEN ==',
          ]
          for phrase in forbidden:
              assert phrase not in active, phrase

          waterfall = Path('scripts/03-3_build-the-contribution-waterfall-for-every-new-dollar.md').read_text(encoding='utf-8')
          assert 'still provisional until Module 4' in waterfall
          assert 'Module 4 decides the final amount' in waterfall

          foundation = Path('scripts/01-4_WALKTHROUGH_foundation.md').read_text(encoding='utf-8')
          assert 'Dashboard → **Add transaction**' in foundation
          assert '**Update my balance**' in foundation and '**Keep my balance**' in foundation

          tax = Path('scripts/05-3_WALKTHROUGH_tax.md').read_text(encoding='utf-8')
          assert 'Dashboard → **Add transaction**' in tax
          assert '**Keep my balance**' in tax

          reserve = Path('scripts/02-2_size-your-cash-reserve-in-months-of-spending.md').read_text(encoding='utf-8')
          assert 'reduce sequence-of-returns risk' in reserve

          main = Path('MASTER-COURSE.md').read_text(encoding='utf-8')
          positions = [
              main.index('Module 2 — Cash Flow + Reserve'),
              main.index('Module 3 — Allocation + Next-Dollar'),
              main.index('Module 4 — Debt Strategy'),
          ]
          assert positions == sorted(positions), positions
          assert 'first full 1,000-path confidence result is saved in Module 9' in main

          assert not Path('SLOP-ACCEPTED.md').exists()
          print('FINAL COURSE CONSISTENCY VERIFIED')
          print(f'core teach={len(core_teach)} captures={len(captures)} advanced={len(advanced)}')
          PY
          git diff --check
      - name: Remove temporary consistency machinery
        run: |
          rm -f final-course-touchup.py
          rm -f .final-course-touchup-trigger
          rm -f .github/workflows/final-course-consistency.yml
      - name: Commit final consistency pass
        run: |
          git config user.name "OpenAI Course Finalizer"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "Complete final course consistency pass"
          git push origin HEAD:course-slide-deck-flow-reset
