name: One-time clean Austin review workspace

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-clean-review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repair branch
        uses: actions/checkout@v4
        with:
          ref: course-repair/app-match-voice-pass
          fetch-depth: 0

      - name: Generate a current-only review workspace
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil
          import zipfile

          root = Path('.')
          review = root / 'review'
          if review.exists():
              shutil.rmtree(review)
          (review / 'scripts').mkdir(parents=True)
          (review / 'lesson-text').mkdir(parents=True)
          (review / 'modules').mkdir(parents=True)

          order_text = (root / 'DICTATION-ORDER.md').read_text(encoding='utf-8')
          script_paths = []
          for path in re.findall(r'\]\((scripts/[^)]+\.md)\)', order_text):
              if path not in script_paths:
                  script_paths.append(path)
          if len(script_paths) != 28:
              raise SystemExit(f'Expected 28 current scripts, found {len(script_paths)}')

          for relative in script_paths:
              source = root / relative
              lesson = root / 'lesson-text' / source.name
              if not source.is_file() or not lesson.is_file():
                  raise SystemExit(f'Missing current pair: {source} / {lesson}')
              shutil.copy2(source, review / 'scripts' / source.name)
              shutil.copy2(lesson, review / 'lesson-text' / lesson.name)

          control_files = [
              'CURRENT-COURSE.md',
              'DICTATION-ORDER.md',
              'AUSTIN-REVIEW-HOLD-REGISTER.md',
              'AUSTIN-REVIEW-INDEX.md',
              'AUSTIN-AUTHORITY.md',
              'SLOP-ACCEPTED.md',
          ]
          for name in control_files:
              shutil.copy2(root / name, review / name)
          shutil.copy2(root / 'scripts' / 'VOICE-GUIDE.md', review / 'VOICE-GUIDE.md')
          shutil.copy2(
              root / 'research' / 'CLIENT-CALL-VOICE-EVIDENCE.md',
              review / 'CLIENT-CALL-VOICE-EVIDENCE.md',
          )

          module_titles = {
              0: 'Start Here',
              1: 'Baseline and Confidence',
              2: 'Cash Flow and Reserve',
              3: 'Debt Strategy',
              4: 'Allocation and the Next Dollar',
              5: 'Tax Strategy',
              6: 'Retirement Income',
              7: 'Custody and Recovery',
              8: 'Estate and Family Handoff',
              9: 'Maintain, Test, and Read',
          }
          grouped = {key: [] for key in module_titles}
          for relative in script_paths:
              grouped[int(Path(relative).name[:2])].append(Path(relative).name)

          for module, names in grouped.items():
              title = module_titles[module]
              parts = [f'# Module {module} — {title}\n']
              for name in names:
                  script = (review / 'scripts' / name).read_text(encoding='utf-8')
                  lesson = (review / 'lesson-text' / name).read_text(encoding='utf-8')
                  parts.append(
                      '\n---\n\n'
                      f'# {name}\n\n'
                      '## SPOKEN SCRIPT\n\n'
                      f'{script}\n\n'
                      '## MATCHING LESSON TEXT\n\n'
                      f'{lesson}\n'
                  )
              slug = title.lower().replace(' ', '-').replace(',', '')
              (review / 'modules' / f'{module:02d}-{slug}.md').write_text(
                  ''.join(parts), encoding='utf-8'
              )

          manifest = [
              '# Austin review workspace manifest',
              '',
              '- Current Core scripts: **28**',
              '- Matching lesson-text files: **28**',
              '- Historical walkthroughs included: **0**',
              '- Historical Advanced scripts included: **0**',
              '- Old master / Circle / generated files included: **0**',
              '',
              '## Current scripts',
              '',
          ]
          manifest.extend(f'- `scripts/{Path(path).name}`' for path in script_paths)
          (review / 'MANIFEST.md').write_text('\n'.join(manifest) + '\n', encoding='utf-8')

          readme = '''# Austin review workspace\n\nThis directory contains only the current Orange Plan Academy Core review material. Old walkthroughs, generated masters, Circle output, historical Advanced scripts, and prior course generations are deliberately excluded.\n\n## Review in this order\n\n1. `DICTATION-ORDER.md` — the 28-lesson queue and direct links\n2. `AUSTIN-REVIEW-HOLD-REGISTER.md` — exact `APP` and `PRO` passages held from final approval\n3. `VOICE-GUIDE.md` and `CLIENT-CALL-VOICE-EVIDENCE.md` — the evidence used to match Austin's real teaching voice\n4. `modules/` — one combined file per module, with spoken script followed by matching lesson text\n5. `scripts/` — individual teleprompter scripts\n6. `lesson-text/` — individual student lessons\n\n## Review marks\n\n- `APPROVE` — keep the section\n- `TIGHTEN` — right idea, too long\n- `SAY IT THIS WAY` — dictate replacement wording\n- `JUDGMENT` — disagree with the recommendation or example\n- `APP` — final app behavior or label must be verified\n- `PRO` — external professional must clear the claim\n- `REMOVE` — the learner does not need it\n\n## Voice status\n\nThese are voice-matched drafts, not a claim that Austin already said every line. They were built from Austin's dictated lessons, client-call teaching, live slides, current app behavior, and Austin's established planning positions. Austin's final spoken read remains the authority.\n'''
          (review / 'README.md').write_text(readme, encoding='utf-8')

          start = '''# START HERE — Austin course review\n\nThe clean review workspace is [`review/`](review/README.md).\n\nDo **not** review from `MASTER-COURSE.md`, `MASTER-ADVANCED.md`, `ALL-SCRIPTS.md`, `modules/`, Circle output, old walkthroughs, or historical decks. Those remain migration/history material until each approved module is synchronized.\n\nFor the fastest review, open [`review/DICTATION-ORDER.md`](review/DICTATION-ORDER.md) or review one combined module at a time under [`review/modules/`](review/modules/).\n\nThe scripts use Austin's actual dictated lessons and client-call teaching as voice evidence. They are not labelled `AUSTIN APPROVED` until Austin completes the final spoken read.\n'''
          (root / '00-START-HERE-AUSTIN-REVIEW.md').write_text(start, encoding='utf-8')

          artifact_dir = root / 'artifact'
          artifact_dir.mkdir(exist_ok=True)
          old_bundle = artifact_dir / 'orange-plan-current-course.zip'
          if old_bundle.exists():
              old_bundle.unlink()
          clean_bundle = artifact_dir / 'orange-plan-austin-review.zip'
          if clean_bundle.exists():
              clean_bundle.unlink()
          with zipfile.ZipFile(clean_bundle, 'w', zipfile.ZIP_DEFLATED) as archive:
              for file in sorted(review.rglob('*')):
                  if file.is_file():
                      archive.write(file, file.relative_to(root))
          PY

      - name: Commit the clean review workspace and remove this workflow
        run: |
          rm .github/workflows/one-time-clean-austin-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "course: add clean Austin review workspace and current-only bundle"
          git push origin HEAD:course-repair/app-match-voice-pass
