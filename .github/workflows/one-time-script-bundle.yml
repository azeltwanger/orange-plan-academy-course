name: One-time current script bundle

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the current review branch
        uses: actions/checkout@v4
        with:
          ref: course-repair/app-match-voice-pass
          fetch-depth: 0

      - name: Build current-course bundle
        run: |
          mkdir -p artifact
          zip -r artifact/orange-plan-current-course.zip \
            scripts lesson-text \
            CURRENT-COURSE.md DICTATION-ORDER.md \
            AUSTIN-REVIEW-INDEX.md AUSTIN-REVIEW-HOLD-REGISTER.md \
            research/CLIENT-CALL-VOICE-EVIDENCE.md \
            scripts/VOICE-GUIDE.md \
            tools/voice_lint.py tools/slop-scan.py SLOP-ACCEPTED.md

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: orange-plan-current-course
          path: artifact/orange-plan-current-course.zip
          retention-days: 1

      - name: Remove one-time workflow
        run: |
          rm .github/workflows/one-time-script-bundle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove one-time current-course bundle workflow"
          git push origin HEAD:course-repair/app-match-voice-pass
