name: Recover unpublished course consolidation
on:
  push:
    branches: [course-consolidate-25-plus-8-20260909]
    paths: [.github/workflows/_recover-consolidation.yml]
permissions:
  contents: read
jobs:
  recover:
    if: github.repository == 'azeltwanger/orange-plan-academy-course'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read previously created course blobs without executing them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, json, base64, hashlib, urllib.request, urllib.error, pathlib, lzma, zlib
          out=pathlib.Path('/tmp/course-recovery');out.mkdir()
          shas=['f5a7cc39d0a6a3a4161d758691b357a8456f4122','fd12bb2069208f2eea92bdf3419f4b6436314080','9394e43497ede838164492de5535576c47c26a04','7355787f8537de15f90bc3e789973a6130e86484','66edc99049ffda72fde03e52ccc0651209622890','ddd3740f8e2aa0358dae08595e85e7969d11631f','c9c9352f5347afd03e23c858a60ea7dba72d419e','362dde8bc0eea25fedf0f5fd851e9e32086ee9c4']
          report=[];data={}
          for i,sha in enumerate(shas,1):
              req=urllib.request.Request('https://api.github.com/repos/azeltwanger/orange-plan-academy-course/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              try:
                  obj=json.load(urllib.request.urlopen(req,timeout=30));raw=base64.b64decode(obj['content']);actual=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest();assert actual==sha
                  data[i]=raw;(out/f'part-{i:02}.bin').write_bytes(raw);report.append({'part':i,'sha':sha,'bytes':len(raw)})
              except urllib.error.HTTPError as e:report.append({'part':i,'sha':sha,'status':e.code})
          prefix=b''
          for i in range(1,8):
              if i not in data:break
              prefix+=data[i]
          if prefix:
              d=lzma.LZMADecompressor();recovered=bytearray()
              try:
                  for b in range(0,len(prefix),128):recovered.extend(d.decompress(prefix[b:b+128]))
                  report.append({'xz_output_bytes':len(recovered),'complete':d.eof})
              except lzma.LZMAError as e:report.append({'xz_error':str(e),'recovered_bytes':len(recovered)})
              (out/'xz-recovered.txt').write_bytes(recovered)
          if 8 in data:
              d=zlib.decompressobj(31);recovered=bytearray()
              try:
                  raw=base64.b64decode(data[8])
                  for b in range(0,len(raw),128):recovered.extend(d.decompress(raw[b:b+128]))
                  report.append({'gzip_output_bytes':len(recovered),'complete':d.eof})
              except Exception as e:report.append({'gzip_error':str(e),'recovered_bytes':len(recovered)})
              (out/'gzip-recovered.txt').write_bytes(recovered)
          (out/'REPORT.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Academy-Recovered-Consolidation
          path: /tmp/course-recovery
          retention-days: 3
          if-no-files-found: error
