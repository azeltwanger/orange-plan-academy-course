name: One-time review packet coherence

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the review branch
        uses: actions/checkout@v4
        with:
          ref: course-repair/app-match-voice-pass
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Align every review control
        run: |
          python - <<'PY'
          from pathlib import Path

          ROOT = Path('.')

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path: str, content: str) -> None:
              (ROOT / path).write_text(content, encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              content = read(path)
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count}: {old!r}')
              write(path, content.replace(old, new, 1))

          def replace_count(path: str, old: str, new: str, expected: int) -> None:
              content = read(path)
              count = content.count(old)
              if count != expected:
                  raise RuntimeError(f'{path}: expected {expected} matches, found {count}: {old!r}')
              write(path, content.replace(old, new))

          replace_once(
              'README.md',
              '''1. **`CURRENT-COURSE.md`** — current Core outline, app results, production stage, and source-of-truth rules
2. **`AUSTIN-DEMO-DECISIONS.md`** — Austin-approved fictional planning judgments
3. **`DEMO-HOUSEHOLD.md`** — continuous household, reconciled source rows, and app interpretation
4. **`demo/ENGINE-CHECKPOINT-CANDIDATE-3105664.md`** — current reproducible Orange Plan outputs
5. **`PRE-DICTATION-QA.md`** — what is complete and which external/UI holds remain
6. **`AUSTIN-REVIEW-INDEX.md`** — the eventual one-pass voice-and-judgment queue
7. **`scripts/`** and **`lesson-text/`** — the current 28 spoken drafts and matching written lessons
8. **`COURSE-APP-CONTRACT.md`** and **`BUILD-YOUR-PLAN-CROSSWALK.md`** — course/app agreement and preview-dependent walkthrough routing
9. **`professional-review/`** — primary-source verification, send-ready packets, candidate pool, outreach, and review controls
10. **`VISUAL-PRODUCTION-BRIEFS.md`** and **`research/SLIDE-CORRECTION-MAP.md`** — future visual direction and treatment of the old live-teaching decks''',
              '''1. **`CURRENT-COURSE.md`** — current Core outline, app results, production stage, and source-of-truth rules
2. **`AUSTIN-DEMO-DECISIONS.md`** — Austin-approved fictional planning judgments
3. **`DEMO-HOUSEHOLD.md`** — continuous household, reconciled source rows, and app interpretation
4. **`demo/ENGINE-CHECKPOINT-CANDIDATE-3105664.md`** — current reproducible Orange Plan outputs
5. **`PRE-DICTATION-QA.md`** — what is complete and which external/UI holds remain
6. **`DICTATION-ORDER.md`** — the current 28-lesson review queue, runtimes, locked values, and script links
7. **`AUSTIN-REVIEW-HOLD-REGISTER.md`** — the exact UI and professional passages held from final approval
8. **`AUSTIN-REVIEW-INDEX.md`** — review waves, decisions, approval tests, and current holds
9. **`scripts/`** and **`lesson-text/`** — the current 28 spoken drafts and matching written lessons
10. **`COURSE-APP-CONTRACT.md`** and **`BUILD-YOUR-PLAN-CROSSWALK.md`** — course/app agreement and preview-dependent walkthrough routing
11. **`professional-review/`** — primary-source verification, send-ready packets, candidate pool, outreach, and review controls
12. **`VISUAL-PRODUCTION-BRIEFS.md`** and **`research/SLIDE-CORRECTION-MAP.md`** — future visual direction and treatment of the old live-teaching decks''',
          )
          replace_once(
              'README.md',
              '''Austin's final voice-and-judgment read has **not** started.

The remaining work is deliberately narrow and should happen before that read:

1. Verify the reconciled synthetic household on the deployed pages and capture eight final UI receipts.
2. Receive and apply actual outside CPA/tax, custody, Colorado estate-attorney, and insurance responses.
3. Use the deployed Build Your Plan flow end to end before recording exact click paths.
4. Finalize visuals and versioned walkthroughs from the accepted receipts.
5. Give Austin each lesson once for wording and judgment approval.''',
              '''Austin's voice-and-judgment review is **ready to begin now**. Use `DICTATION-ORDER.md`; record `APP` or `PRO` holds from `AUSTIN-REVIEW-HOLD-REGISTER.md` and keep moving.

The remaining work runs alongside Austin's review and must clear before final approval or filming:

1. Verify the reconciled synthetic household on the deployed pages and capture eight final UI receipts.
2. Receive and apply actual outside CPA/tax, custody, Colorado estate-attorney, and insurance responses.
3. Use the deployed Build Your Plan flow end to end before recording exact click paths.
4. Finalize visuals and versioned walkthroughs from the accepted receipts.
5. Apply only the named corrections, reconcile lesson text, and give the corrected lesson one clean final read before `AUSTIN APPROVED`.''',
          )

          replace_once(
              'CURRENT-COURSE.md',
              '''1. `CURRENT-COURSE.md` — current curriculum and production stage
2. `AUSTIN-DEMO-DECISIONS.md` — Austin-approved fictional planning judgments
3. `DEMO-HOUSEHOLD.md` — human-readable continuous demo and app interpretation
4. `demo/demo-v1-inputs.json` — machine-readable source contract
5. `demo/ENGINE-CHECKPOINT-CANDIDATE-3105664.md` — reconciled app-engine outputs
6. `demo/VISUAL-DATA-RECEIPT-3105664.md` — current production values
7. `PRE-DICTATION-QA.md` — remaining gates
8. `FILMING-READINESS.md` — film and publish gates
9. `scripts/` — current spoken drafts
10. `lesson-text/` — matching student reference text
11. `COURSE-APP-CONTRACT.md` — teaching, app-state, and provenance rules
12. `BUILD-YOUR-PLAN-CROSSWALK.md` — walkthrough routing contract
13. `professional-review/` — source verification and external-review packets
14. `research/SLIDE-CORRECTION-MAP.md` — treatment of the live-client decks
15. `research/CLIENT-CALL-VOICE-EVIDENCE.md` and `research/CLIENT-CONFUSION-REGISTRY.md`''',
              '''1. `CURRENT-COURSE.md` — current curriculum and production stage
2. `AUSTIN-DEMO-DECISIONS.md` — Austin-approved fictional planning judgments
3. `DEMO-HOUSEHOLD.md` — human-readable continuous demo and app interpretation
4. `demo/demo-v1-inputs.json` — machine-readable source contract
5. `demo/ENGINE-CHECKPOINT-CANDIDATE-3105664.md` — reconciled app-engine outputs
6. `demo/VISUAL-DATA-RECEIPT-3105664.md` — current production values
7. `PRE-DICTATION-QA.md` — remaining gates
8. `DICTATION-ORDER.md` — Austin's current review queue and locked values
9. `AUSTIN-REVIEW-HOLD-REGISTER.md` — named UI and professional approval holds
10. `AUSTIN-REVIEW-INDEX.md` — review waves and approval tests
11. `FILMING-READINESS.md` — film and publish gates
12. `scripts/` — current spoken drafts
13. `lesson-text/` — matching student reference text
14. `COURSE-APP-CONTRACT.md` — teaching, app-state, and provenance rules
15. `BUILD-YOUR-PLAN-CROSSWALK.md` — walkthrough routing contract
16. `professional-review/` — source verification and external-review packets
17. `research/SLIDE-CORRECTION-MAP.md` — treatment of the live-client decks
18. `research/CLIENT-CALL-VOICE-EVIDENCE.md` and `research/CLIENT-CONFUSION-REGISTRY.md`''',
          )
          replace_count('CURRENT-COURSE.md', '| NOT STARTED |', '| READY TO BEGIN |', 10)
          replace_once(
              'CURRENT-COURSE.md',
              '''Austin reads each script once, changes only wording or judgment he would naturally express differently, confirms the example and app terminology, and marks `AUSTIN APPROVED` after one clean final read. The structure and demo should not need another rebuild.''',
              '''Austin reviews each script once now for voice and judgment. A lesson with no named hold can move directly toward approval. A held lesson receives only its scoped UI or professional correction, then one clean final read before `AUSTIN APPROVED`. The structure and demo should not need another rebuild.''',
          )

          replace_once(
              'AUSTIN-REVIEW-INDEX.md',
              '''**Purpose:** give Austin one place to perform the final voice-and-judgment pass after structural, numeric, app, and professional corrections are complete.''',
              '''**Purpose:** give Austin one place to review the stable Core now, record exact voice and judgment changes, and return only to lessons with named UI or professional holds for final clearance.''',
          )
          replace_once(
              'AUSTIN-REVIEW-INDEX.md',
              'During the final read, review only:',
              'During this review, focus on:',
          )

          replace_once(
              'PRE-DICTATION-QA.md',
              '## Remaining holds before Austin reads once',
              '## Remaining holds before final approval and filming',
          )

          replace_once(
              'FILMING-READINESS.md',
              "- `AUSTIN` — ready for Austin's final spoken read",
              "- `AUSTIN` — ready for Austin's voice-and-judgment review",
          )
          replace_count('FILMING-READINESS.md', '| HOLD | NO |', '| AUSTIN | NO |', 10)

          replace_count(
              'tools/pre_dictation_control_audit.py',
              '    "AUSTIN-REVIEW-INDEX.md",\n    "DEMO-CHECKPOINT-RUN-SHEET.md",',
              '    "AUSTIN-REVIEW-INDEX.md",\n    "DICTATION-ORDER.md",\n    "AUSTIN-REVIEW-HOLD-REGISTER.md",\n    "DEMO-CHECKPOINT-RUN-SHEET.md",',
              2,
          )
          replace_once(
              'tools/pre_dictation_control_audit.py',
              '''    "BUILD-YOUR-PLAN-CROSSWALK.md": (
        "deployed Build Your Plan flow",
        "app_completion_rule",
        "human_completion_rule",
    ),''',
              '''    "DICTATION-ORDER.md": (
        "Austin may begin the voice-and-judgment review",
        "25,407 spoken words",
        "0.079251 BTC",
    ),
    "AUSTIN-REVIEW-HOLD-REGISTER.md": (
        "A held line blocks",
        "## UI holds",
        "## Professional and real-world holds",
    ),
    "BUILD-YOUR-PLAN-CROSSWALK.md": (
        "deployed Build Your Plan flow",
        "app_completion_rule",
        "human_completion_rule",
    ),''',
          )

          print('Review packet controls aligned.')
          PY
          python tools/build-dictation-order.py
          python tools/voice_lint.py --strict-warnings
          python tools/run_all_audits.py

      - name: Remove the one-time workflow and commit the result
        run: |
          rm .github/workflows/one-time-review-packet-coherence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "course: make Austin review readiness unambiguous"
          git push origin HEAD:course-repair/app-match-voice-pass
