name: One-time review packet coherence

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the review branch
        uses: actions/checkout@v4
        with:
          ref: course-repair/app-match-voice-pass
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Align every review control and run all audits
        run: |
          python tools/apply_review_packet_coherence.py
          python tools/build-dictation-order.py
          python tools/voice_lint.py --strict-warnings
          python tools/run_all_audits.py

      - name: Remove one-time files and commit the result
        run: |
          rm .github/workflows/one-time-review-packet-coherence.yml
          rm tools/apply_review_packet_coherence.py
          rm .review-packet-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "course: make Austin review readiness unambiguous"
          git push origin HEAD:course-repair/app-match-voice-pass
