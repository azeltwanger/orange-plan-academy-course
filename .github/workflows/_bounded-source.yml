name: Snapshot bounded review source
on:
  push:
    branches: [course-bounded-review-fixes-20260910]
    paths: [.github/workflows/_bounded-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 87c6e183385a5107a8dc14b240119a2adff9c96f
          fetch-depth: 0
          persist-credentials: false
      - name: Bundle pinned source and recoverable history
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = 87c6e183385a5107a8dc14b240119a2adff9c96f
          mkdir -p /tmp/bounded-source
          git bundle create /tmp/bounded-source/history.bundle HEAD
          git rev-parse HEAD > /tmp/bounded-source/COMMIT.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Academy-Bounded-Source
          path: /tmp/bounded-source
          retention-days: 2
          if-no-files-found: error
