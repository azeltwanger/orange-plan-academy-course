name: Finalize V1 course alignment branch

on:
  push:
    branches:
      - course-v1-alignment-direct-language
    paths:
      - .alignment-finalize-trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: course-v1-alignment-direct-language
          fetch-depth: 0

      - name: Apply pass if it has not been committed yet
        run: |
          if [ ! -f V1-COURSE-ALIGNMENT.md ]; then
            test -f alignment-pass/apply.py
            python3 alignment-pass/apply.py
          fi

      - name: Verify final branch content
        run: |
          python3 - <<'PY'
          from pathlib import Path

          required = {
              'V1-COURSE-ALIGNMENT.md': ['Substantive rewrites'],
              'DIRECT-LANGUAGE-AUDIT.md': ['affirmative-first'],
              'scripts/00-2_how-to-use-orange-plan-ai.md': ['Ask is a second set of eyes'],
              'scripts/01-3_what-the-onboarding-retirement-age-actually-means.md': ['800 successful simulations out of 1,000'],
              'scripts/06-3_use-plan-confidence-and-guardrails-to-adjust-spending.md': ['lower guardrail', 'upper guardrail'],
              'scripts/09-1_keep-the-plan-current-without-rebuilding-it.md': ['Home', 'Cash Flow', 'Plan', 'Protect'],
              'scripts/09-2_test-decisions-and-read-the-finished-plan.md': ['Current is the saved plan', 'Your Plan'],
              'scripts/03-1_set-the-bitcoin-allocation-you-can-actually-hold.md': ['Use the four paths to identify where you are today.'],
          }
          for name, phrases in required.items():
              text = Path(name).read_text(encoding='utf-8')
              for phrase in phrases:
                  assert phrase.lower() in text.lower(), f'{name}: missing {phrase}'

          active = '\n'.join(
              p.read_text(encoding='utf-8')
              for p in Path('scripts').rglob('*.md')
              if p.name not in {'README.md', 'VOICE-GUIDE.md'}
          )
          for phrase in (
              'The four paths on the screen are not recommendations',
              'choose the confidence target',
              '60 cut → 80 hold → 95 raise',
              'the first full confidence run happens after the plan is built in Module 9',
          ):
              assert phrase.lower() not in active.lower(), phrase

          for path in Path('scripts').glob('*WALKTHROUGH*.md'):
              assert 'V1 FILMING HOLD' in path.read_text(encoding='utf-8'), path
          PY
          python3 tools/check-crossrefs.py
          git diff --check

      - name: Remove all one-time runner files
        run: |
          rm -rf alignment-pass
          rm -f .alignment-finalize-trigger
          rm -f .github/workflows/apply-v1-course-alignment.yml
          rm -f .github/workflows/finalize-v1-course-alignment.yml

      - name: Commit and push the completed branch
        run: |
          git config user.name "OpenAI Course Alignment Pass"
          git config user.email "noreply@openai.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Align course to V1 and lead with the point"
            git push origin HEAD:course-v1-alignment-direct-language
          fi

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view course-v1-alignment-direct-language --repo azeltwanger/orange-plan-academy-course >/dev/null 2>&1; then
            gh pr edit course-v1-alignment-direct-language \
              --repo azeltwanger/orange-plan-academy-course \
              --title "Align Academy to Orange Plan V1 and lead with the point" \
              --body-file - <<'EOF'
          ## What changed

          - Aligned the Academy with the accepted product contracts in Orange Plan PR #227.
          - Replaced normal-user confidence-target teaching with the fixed Orange Plan standard of 800 successful simulations out of 1,000.
          - Reframed results around counts, through-age, planned versus earliest modeled dates, and Preliminary / Current / Stale / Unavailable states.
          - Rebuilt 0.2, 1.3, 6.3, 9.1, and 9.2 around Ask, Build & improve, Current versus Preview, portfolio guardrails, the four permanent destinations, and Your Plan.
          - Rebuilt the Foundation, Retirement Income, and final-plan walkthrough sheets and placed every app walkthrough on a V1 filming hold.
          - Reviewed core and Advanced lessons for rhetorical “not X, but Y” framing, rewrote the direct point, and added an affirmative-first rule to the voice guide.
          - Updated the affected visual briefs, production checklist, authority files, generated course layers, and audit reports.

          ## Verification

          - Required V1 teaching contracts asserted across the active scripts.
          - Legacy confidence-target, visible 60/80/95 guardrail, and old first-full-run language rejected.
          - Every app walkthrough carries a V1 filming hold.
          - Course cross-references passed.
          - `git diff --check` passed.
          EOF
          else
            gh pr create \
              --repo azeltwanger/orange-plan-academy-course \
              --base main \
              --head course-v1-alignment-direct-language \
              --title "Align Academy to Orange Plan V1 and lead with the point" \
              --body-file - <<'EOF'
          ## What changed

          - Aligned the Academy with the accepted product contracts in Orange Plan PR #227.
          - Replaced normal-user confidence-target teaching with the fixed Orange Plan standard of 800 successful simulations out of 1,000.
          - Reframed results around counts, through-age, planned versus earliest modeled dates, and Preliminary / Current / Stale / Unavailable states.
          - Rebuilt 0.2, 1.3, 6.3, 9.1, and 9.2 around Ask, Build & improve, Current versus Preview, portfolio guardrails, the four permanent destinations, and Your Plan.
          - Rebuilt the Foundation, Retirement Income, and final-plan walkthrough sheets and placed every app walkthrough on a V1 filming hold.
          - Reviewed core and Advanced lessons for rhetorical “not X, but Y” framing, rewrote the direct point, and added an affirmative-first rule to the voice guide.
          - Updated the affected visual briefs, production checklist, authority files, generated course layers, and audit reports.

          ## Verification

          - Required V1 teaching contracts asserted across the active scripts.
          - Legacy confidence-target, visible 60/80/95 guardrail, and old first-full-run language rejected.
          - Every app walkthrough carries a V1 filming hold.
          - Course cross-references passed.
          - `git diff --check` passed.
          EOF
          fi
