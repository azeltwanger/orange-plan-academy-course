name: Prepare individual Debt teaching review
on:
  push:
    branches: [course-teaching-repair-session03-20260908]
    paths: [.github/workflows/_session03-author.yml]
permissions:
  contents: read
concurrency:
  group: academy-session03-individual-repair
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'azeltwanger/orange-plan-academy-course' && github.ref == 'refs/heads/course-teaching-repair-session03-20260908'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Guard source and synchronize the already-written replacements
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '8f04e681e21506a6ea428a6c2a1a984f63a0eaca'
          test "$(git hash-object scripts/02-3_size-the-reserve-for-the-job-it-has-to-do.md)" = '2c107a394a93cc877c73f011dfe37fb5ad3d94b1'
          python tools/_prepare_session03_repair.py
          python -m py_compile tools/guided_course.py
          python tools/guided_course.py build
          python tools/guided_course.py check
          python tools/guided_course.py test
          python -m unittest discover -s tests -p test_member_deliverables.py -v
          python tools/guided_course.py history
      - name: Verify preservation and publish only to the dedicated repair branch
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff 8f04e681e21506a6ea428a6c2a1a984f63a0eaca --name-only -- source-material fixtures toolkit tests CAPTURE-RECEIPTS.md PROMOTION-RECORD.json production 'scripts/02-*' scripts/working/W02_verify-cash-flow-set-the-reserve-and-add-expected-events.md)"
          git add scripts lesson-text teleprompter modules README.md FINALIZATION-STATUS.md HANDOFF.md tools/guided_course.py COURSE-MANIFEST.json MASTER-COURSE.md MASTER-ADVANCED.md ALL-SCRIPTS.md DICTATION-ORDER.md ADVANCED-DICTATION-ORDER.md FILM-ORDER.md CIRCLE-STRUCTURE.md SCREEN-SHOOT-LIST.md MODULE-CHECKPOINTS.md PRODUCTION-CHECKLIST.md COURSE-METRICS.md ARITHMETIC-CHECKS.json
          test -z "$(git diff --cached --name-only -- .github source-material fixtures toolkit tests CAPTURE-RECEIPTS.md PROMOTION-RECORD.json production 'scripts/02-*' scripts/working/W02_verify-cash-flow-set-the-reserve-and-add-expected-events.md)"
          git diff --cached --check
          git fetch origin refs/heads/course-teaching-repair-session03-20260908
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Synchronize Debt replacement reading copies and current repair progress'
          git push origin HEAD:refs/heads/course-teaching-repair-session03-20260908
          test "$(git ls-remote origin refs/heads/course-teaching-repair-session03-20260908 | cut -f1)" = "$(git rev-parse HEAD)"
          python tools/guided_course.py check
          git diff --exit-code
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
