name: Sync Austin review workspace

on:
  push:
    branches:
      - 'course-repair/**'
    paths:
      - 'scripts/**'
      - 'lesson-text/**'
      - 'CURRENT-COURSE.md'
      - 'AUSTIN-REVIEW-INDEX.md'
      - 'AUSTIN-REVIEW-HOLD-REGISTER.md'
      - 'AUSTIN-AUTHORITY.md'
      - 'SLOP-ACCEPTED.md'
      - 'VOICE-GUIDE.md'
      - 'AI-PLANNING-QUESTION-GUIDE.md'
      - 'research/CLIENT-CALL-VOICE-EVIDENCE.md'
      - 'tools/build-dictation-order.py'
      - 'tools/sync-review-workspace.py'
      - '.github/workflows/review-workspace-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: review-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out course branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Synchronize current review workspace
        run: python tools/sync-review-workspace.py

      - name: Commit generated review files
        run: |
          if git diff --quiet; then
            echo "Review workspace is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CURRENT-COURSE.md DICTATION-ORDER.md review artifact/orange-plan-austin-review.zip
          git commit -m "chore: synchronize Austin review workspace"
          git push origin "HEAD:${GITHUB_REF_NAME}"
