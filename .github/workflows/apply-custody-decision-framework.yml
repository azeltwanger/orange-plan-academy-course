name: Apply custody decision framework

on:
  push:
    branches:
      - course-custody-decision-framework
    paths:
      - custody-framework/RUN

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: course-custody-decision-framework
          fetch-depth: 0

      - name: Apply Austin custody decision framework
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('custody-framework/apply.py')
          text = p.read_text(encoding='utf-8')
          for line in (
              '    ["python3", "tools/split-modules.py"],\n',
              '    ["python3", "tools/split-modules.py", "--advanced"],\n',
              '    ["python3", "tools/build-production-checklist.py"],\n',
              '    ["python3", "tools/course-metrics.py"],\n',
          ):
              text = text.replace(line, '')
          p.write_text(text, encoding='utf-8')
          PY
          python3 custody-framework/apply.py
          python3 custody-framework/sync-modules.py

      - name: Verify custody positions and layer parity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          required = {
              'scripts/07-1_self-custody-professional-custody-and-when-a-split-makes-sense.md': ['institutional custody', 'One-Failure Test', 'readiness'],
              'scripts/07-3_fix-single-points-of-failure-and-harden-accounts.md': ['One-Failure Test', 'one custody method', 'one institution'],
              'scripts/07-5_WALKTHROUGH_document-the-custody-decision-and-status.md': ['Custody Decision Map', 'direct-control preference'],
              'scripts/advanced/A7-1_compare-passphrase-multisig-institutional-custody-and-an-intentional-split.md': ['Institutional custody is a different trade-off', 'intentional split'],
              'scripts/advanced/A7-2_what-self-custody-asks-of-you.md': ['professionally supported Bitcoin'],
              'scripts/advanced/A7-3_run-the-one-failure-test-across-methods-and-providers.md': ['One-Failure Test', 'life-changing pool'],
              'MASTER-COURSE.md': ['## 7.1 Self-custody, professional custody, and when a split makes sense', '## 7.5 WALKTHROUGH — Document the custody decision'],
              'MASTER-ADVANCED.md': ['## A7.1 Compare passphrase, multisig, institutional custody, and an intentional split'],
              'modules/07-custody.md': ['One-Failure Test', 'Catastrophic concentration'],
              'modules/advanced/A07-custody.md': ['Institutional custody is a different trade-off'],
              'MODULE-CHECKPOINTS.md': ['Custody direction is one method or an intentional split'],
              'CUSTODY-DECISION-MAP.md': ['Replaceable / Meaningful / Life-changing', 'One custody method protecting all life-changing Bitcoin'],
              'AUSTIN-AUTHORITY.md': ['Custody is not a wealth ladder'],
              'visuals/7-1b_levels-and-trust.md': ['Institutional custody', 'Catastrophic concentration removed'],
          }
          for name, needles in required.items():
              path = Path(name)
              assert path.exists(), name
              text = path.read_text(encoding='utf-8')
              for needle in needles:
                  assert needle.lower() in text.lower(), f'{name}: missing {needle}'

          obsolete = [
              Path('scripts/07-1_choose-a-custody-setup-your-household-can-recover.md'),
              Path('scripts/07-5_WALKTHROUGH_document-custody-status.md'),
              Path('scripts/advanced/A7-1_advanced-custody.md'),
              Path('scripts/advanced/A7-3_avoid-custody-concentration.md'),
          ]
          assert not any(path.exists() for path in obsolete), obsolete

          active = '\n'.join(Path(name).read_text(encoding='utf-8') for name in (
              'MASTER-COURSE.md',
              'MASTER-ADVANCED.md',
              'modules/07-custody.md',
              'modules/advanced/A07-custody.md',
          ))
          assert 'Level one is a hardened exchange' not in active
          assert 'None — 2-of-3' not in active
          PY

      - name: Verify course references and formatting
        run: |
          python3 tools/check-crossrefs.py
          git diff --check

      - name: Remove one-time runner
        run: |
          rm -rf custody-framework
          rm -f .github/workflows/apply-custody-decision-framework.yml

      - name: Commit completed custody pass
        run: |
          git config user.name "OpenAI Custody Course Pass"
          git config user.email "noreply@openai.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Reframe custody around trade-offs and the One-Failure Test"
          git push origin HEAD:course-custody-decision-framework
