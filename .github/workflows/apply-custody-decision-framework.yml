name: Apply custody decision framework

on:
  push:
    branches:
      - course-custody-decision-framework
    paths:
      - custody-framework/RUN

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: course-custody-decision-framework
          fetch-depth: 0

      - name: Apply Austin custody decision framework
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('custody-framework/apply.py')
          text = p.read_text(encoding='utf-8')
          for line in (
              '    ["python3", "tools/split-modules.py"],\n',
              '    ["python3", "tools/split-modules.py", "--advanced"],\n',
              '    ["python3", "tools/build-production-checklist.py"],\n',
              '    ["python3", "tools/course-metrics.py"],\n',
          ):
              text = text.replace(line, '')
          p.write_text(text, encoding='utf-8')
          PY
          python3 custody-framework/apply.py
          python3 custody-framework/sync-modules.py

      - name: Verify custody positions
        run: |
          grep -qi "institutional custody" scripts/07-1_self-custody-professional-custody-and-when-a-split-makes-sense.md
          grep -q "One-Failure Test" scripts/07-3_fix-single-points-of-failure-and-harden-accounts.md
          grep -qi "one custody method" CUSTODY-DECISION-MAP.md
          grep -q "Custody is not a wealth ladder" AUSTIN-AUTHORITY.md
          grep -q "institutional custody" MASTER-ADVANCED.md
          grep -q "Catastrophic concentration" visuals/7-1b_levels-and-trust.md
          grep -q "Custody direction is one method or an intentional split" MODULE-CHECKPOINTS.md

      - name: Verify course integrity
        run: |
          python3 tools/check-crossrefs.py
          python3 tools/check-layer-parity.py
          python3 tools/slop-scan.py --all
          python3 tools/check-visuals.py
          python3 tools/test-layer-parity-mutations.py
          git diff --check

      - name: Remove one-time runner
        run: |
          rm -rf custody-framework
          rm -f .github/workflows/apply-custody-decision-framework.yml

      - name: Commit completed custody pass
        run: |
          git config user.name "OpenAI Custody Course Pass"
          git config user.email "noreply@openai.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Reframe custody around trade-offs and the One-Failure Test"
          git push origin HEAD:course-custody-decision-framework
