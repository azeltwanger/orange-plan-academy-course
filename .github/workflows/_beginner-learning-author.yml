name: Prepare decision-learning and simulated beginner review
on:
  push:
    branches: [course-decision-learning-20260909]
    paths: [.github/workflows/_beginner-learning-author.yml]
permissions:
  contents: read
concurrency:
  group: academy-decision-learning-20260909
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'azeltwanger/orange-plan-academy-course' && github.ref == 'refs/heads/course-decision-learning-20260909'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply the bounded authored learning edit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '0f26cbd5556664776531b50ff11735ae5860c8b0'
          python -m py_compile tools/_beginner_learning_edits.py tools/_beginner_learning_practice.py tools/_apply_beginner_learning_review.py
          python tools/_apply_beginner_learning_review.py apply
          python -m py_compile tools/guided_course.py
          python tools/guided_course.py build
          python tools/guided_course.py check
          python tools/guided_course.py test
          python -m unittest discover -s tests -p test_member_deliverables.py -v
          python tools/guided_course.py history
      - name: Preserve evidence and publish only to the dedicated review branch
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff 0f26cbd5556664776531b50ff11735ae5860c8b0 --name-only -- source-material fixtures toolkit tests CAPTURE-RECEIPTS.md PROMOTION-RECORD.json production delivery/professional-topic-review.md scripts/02-3_size-the-reserve-for-the-job-it-has-to-do.md scripts/working/W02_verify-cash-flow-set-the-reserve-and-add-expected-events.md scripts/working/D07_prove-a-wallet-backup-with-a-safe-test-setup.md)"
          git add scripts lesson-text teleprompter modules README.md FINALIZATION-STATUS.md HANDOFF.md delivery/decision-learning-review.md delivery/decision-learning-changes.json tools/guided_course.py COURSE-MANIFEST.json MASTER-COURSE.md MASTER-ADVANCED.md ALL-SCRIPTS.md DICTATION-ORDER.md ADVANCED-DICTATION-ORDER.md FILM-ORDER.md CIRCLE-STRUCTURE.md SCREEN-SHOOT-LIST.md MODULE-CHECKPOINTS.md PRODUCTION-CHECKLIST.md COURSE-METRICS.md ARITHMETIC-CHECKS.json
          test -z "$(git diff --cached --name-only -- .github source-material fixtures toolkit tests CAPTURE-RECEIPTS.md PROMOTION-RECORD.json production)"
          git diff --cached --check
          git fetch origin refs/heads/course-decision-learning-20260909
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add decision-learning practice and targeted beginner explanations without claiming learner validation'
          git push origin HEAD:refs/heads/course-decision-learning-20260909
          test "$(git ls-remote origin refs/heads/course-decision-learning-20260909 | cut -f1)" = "$(git rev-parse HEAD)"
          python tools/guided_course.py check
          git diff --exit-code
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Export source-matched review files for inspection
        run: python tools/_apply_beginner_learning_review.py export /tmp/decision-learning-review
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Orange-Plan-Decision-Learning-Review
          path: /tmp/decision-learning-review
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
