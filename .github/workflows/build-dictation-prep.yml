name: Build dictation-ready drafts

on:
  push:
    branches:
      - course-dictation-ready-drafts
    paths:
      - dictation-prep-trigger/RUN

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: course-dictation-ready-drafts
          fetch-depth: 0

      - name: Build pre-dictation drafts and correct lesson 1.3
        run: python3 tools/build-dictation-prep.py

      - name: Verify course layers
        run: |
          python3 tools/check-crossrefs.py
          python3 tools/check-layer-parity.py
          python3 tools/slop-scan.py --all
          python3 tools/check-visuals.py
          python3 tools/course-metrics.py --check

      - name: Remove trigger and workflow
        run: |
          rm -rf dictation-prep-trigger
          rm -f .github/workflows/build-dictation-prep.yml

      - name: Commit generated drafts
        run: |
          git config user.name "OpenAI Dictation Prep"
          git config user.email "noreply@openai.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Build pre-dictation working drafts"
          git push origin HEAD:course-dictation-ready-drafts
