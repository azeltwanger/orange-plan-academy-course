name: Verify member deliverables
on:
  pull_request:
    branches: [course-guided-build-recut]
    paths:
      - 'toolkit/**'
      - 'delivery/**'
      - 'tests/test_member_deliverables.py'
      - '.github/workflows/member-deliverables.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Existing course and generated-layer verification
        run: |
          python tools/guided_course.py check
          python tools/guided_course.py test
      - name: Member deliverables and source-pinned arithmetic
        run: python -m unittest discover -s tests -p test_member_deliverables.py -v
      - name: Verify checks did not change tracked files
        run: git diff --exit-code
