name: Publish checked consolidated course branch
on:
  push:
    branches: [course-consolidate-25-plus-8-20260909]
    paths: [.github/workflows/_publish-consolidation.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'azeltwanger/orange-plan-academy-course'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply exact source edits, verify and push review branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, importlib.util, json, lzma, os, pathlib, re, subprocess, urllib.request
          root=pathlib.Path.cwd()
          repo='azeltwanger/orange-plan-academy-course'
          branch='course-consolidate-25-plus-8-20260909'
          base='c4c55601dfdaa893343623a75f478cbbfef120ad'
          parts=['0da8226c84267aed822932996d4120311306bef1','ed3c47e69a58972a843fac1daae5339c1e27406e','852cf227b058933143838b10bb5eeb6e3733b25d','4bd919abe15a268f2694dd8b95060c8b2399bdb2','5e9c93696dca99d77dde89a7ef5bf9d967af5513','1cbfc09b91f4c84838cb3959d3d36ae0a85041ea','db42cf623101469a6190eea6a8df3bcfcfcdb648','97b3d262a09a9bdb78613c95dcd13a18b15c96e7','27a00fb4d5025646720657dd285115389d888c14','7fa269c836d04e59cbbc59901089ef69836bf284','7b0eee9a4109f38ff0994544677dd73bddea9149','7fed93e0ae19b7ce4d761ff87c725ee9dc4f5cbc','398980f3dbd6a164cea1335c4e49fb8489df973c']
          helpers={'.github/workflows/_recover-consolidation.yml','.github/workflows/_consolidate-snapshot.yml','.github/workflows/_publish-consolidation.yml'}
          def run(*args):
              return subprocess.check_output(args,cwd=root).decode().strip()
          def digest(data):return hashlib.sha256(data).hexdigest()
          def safe(path):
              p=pathlib.PurePosixPath(path)
              assert not p.is_absolute() and '..' not in p.parts and str(p)==path
              assert '.git' not in p.parts
              target=root/path
              assert not target.is_symlink() and all(not x.is_symlink() for x in target.parents)
              return target
          assert os.environ['GITHUB_REPOSITORY']==repo
          assert os.environ['GITHUB_REF']=='refs/heads/'+branch
          start=run('git','rev-parse','HEAD')
          assert start==os.environ['GITHUB_SHA']
          assert run('git','ls-remote','origin','refs/heads/main').split()[0]==base
          subprocess.run(['git','merge-base','--is-ancestor',base,start],check=True)
          chunks=[]
          for sha in parts:
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response:obj=json.load(response)
              data=base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              chunks.append(data)
          packed=b''.join(chunks)
          assert digest(packed)=='aaf24496e71319f8dcf9030a26eca8e4d44973cbe0687c03b72e9395cdc24204'
          payload=json.loads(lzma.decompress(packed));os.environ.pop('GH_TOKEN',None)
          assert payload['format']==1 and payload['base']==base
          assert [len(payload[x]) for x in ['stage1','stage2','delete','expected_tree']]==[38,49,32,210]
          cache={}
          for row in subprocess.check_output(['git','ls-tree','-rz',base]).split(b'\0'):
              if not row:continue
              meta,path=row.split(b'\t',1);mode,kind,sha=meta.split();name=path.decode();safe(name)
              assert kind==b'blob' and mode in (b'100644',b'100755')
              cache[name]=subprocess.check_output(['git','cat-file','blob',sha])
          def apply(records,snapshot):
              updates={}
              for rec in records:
                  name=rec['path'];target=safe(name)
                  assert name not in helpers and not name.startswith('.github/')
                  before=digest(target.read_bytes()) if target.exists() else None
                  assert before==rec['before'],('Concurrent edit',name)
                  text=[]
                  for part in rec['parts']:
                      if isinstance(part,str):text.append(part)
                      else:
                          source,offset,count=part;safe(source)
                          assert source in snapshot and isinstance(offset,int) and isinstance(count,int) and offset>=0 and count>0
                          lines=snapshot[source].decode().splitlines(keepends=True)
                          assert offset+count<=len(lines)
                          text.append(''.join(lines[offset:offset+count]))
                  data=''.join(text).encode();assert digest(data)==rec['after'],name
                  assert name not in updates;updates[name]=data
              for name,data in updates.items():
                  target=safe(name);target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
              return updates
          run('git','config','user.name','github-actions[bot]')
          run('git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          assert all(x['path'].startswith('scripts/') for x in payload['stage1'])
          first=apply(payload['stage1'],cache)
          run('git','add','--',*first)
          run('git','commit','-m','Preserve owner-delivered script-first source drafts')
          cache.update(first)
          apply(payload['stage2'],cache)
          for rec in payload['delete']:
              assert rec['path'].startswith('scripts/')
              target=safe(rec['path']);assert digest(target.read_bytes())==rec['before'];target.unlink()
          spec=importlib.util.spec_from_file_location('course',root/'tools/guided_course.py')
          g=importlib.util.module_from_spec(spec);spec.loader.exec_module(g)
          expected=g.outputs(root)
          for folder in ['teleprompter','lesson-text','modules']:
              for p in (root/folder).rglob('*'):
                  if p.is_file() and p.relative_to(root).as_posix() not in expected:p.unlink()
          g.build(root)
          # Helpers are removed through the owner-authorized GitHub connector after this run.
          # The job never changes workflow files or writes main.
          def verify_tree():
              actual={}
              for p in root.rglob('*'):
                  name=p.relative_to(root).as_posix()
                  if p.is_file() and '.git' not in p.parts and '__pycache__' not in p.parts and name not in helpers:actual[name]=digest(p.read_bytes())
              assert actual==payload['expected_tree'],{'extra':sorted(actual.keys()-payload['expected_tree'].keys()),'missing':sorted(payload['expected_tree'].keys()-actual.keys()),'changed':[x for x in actual.keys() & payload['expected_tree'].keys() if actual[x]!=payload['expected_tree'][x]]}
          verify_tree()
          for args in [('check',),('test',),('history',)]:
              subprocess.run(['python','tools/guided_course.py',*args],check=True)
          subprocess.run(['python','-m','unittest','discover','-s','tests','-p','test_member_deliverables.py','-v'],check=True)
          verify_tree()
          run('git','add','-A')
          changed=run('git','diff','--cached','--name-only').splitlines()
          assert not any(x.startswith('.github/') for x in changed)
          run('git','commit','-m','Consolidate Academy into 25 main and 8 situational recording scripts')
          assert not run('git','status','--porcelain')
          assert run('git','ls-remote','origin','refs/heads/main').split()[0]==base
          assert run('git','ls-remote','origin','refs/heads/'+branch).split()[0]==start
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          print('PUBLISHED_COURSE_BRANCH='+run('git','rev-parse','HEAD'))
          print('PASS: 210 exact final files verified, excluding three temporary workflows pending connector removal.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Course branch updated: '+run('git','rev-parse','HEAD')+'\n\n25 main and 8 situational scripts; 210 exact file hashes; course, mutation, history and unit checks passed. Main unchanged. Three temporary workflow files still require connector removal.\n')
          PY
