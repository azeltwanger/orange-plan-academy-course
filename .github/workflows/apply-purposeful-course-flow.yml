name: Apply purposeful course flow

on:
  push:
    branches:
      - course-dictation-ready-drafts
    paths:
      - purposeful-flow/RUN

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: course-dictation-ready-drafts
          fetch-depth: 0

      - name: Apply purposeful pre-dictation and course-flow pass
        run: python3 purposeful-flow/apply.py

      - name: Regenerate dependent course layers
        run: |
          python3 tools/build-module-gates.py
          python3 tools/build-scripts.py
          python3 tools/build-scripts.py --advanced
          python3 tools/split-modules.py
          python3 tools/split-modules.py --advanced
          python3 tools/build-onefile.py
          python3 tools/build-circle-structure.py
          python3 tools/build-dictation-order.py
          python3 tools/build-film-order.py
          python3 tools/build-shoot-list.py
          python3 tools/build-production-checklist.py
          python3 tools/course-metrics.py

      - name: Verify course integrity
        run: |
          python3 tools/check-crossrefs.py
          python3 tools/check-layer-parity.py
          python3 tools/slop-scan.py --all
          python3 tools/check-visuals.py
          python3 tools/course-metrics.py --check
          python3 tools/test-layer-parity-mutations.py
          git diff --check

      - name: Remove one-time runner
        run: |
          rm -rf purposeful-flow
          rm -f .github/workflows/apply-purposeful-course-flow.yml

      - name: Commit final pass
        run: |
          git config user.name "OpenAI Course Flow Pass"
          git config user.email "noreply@openai.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Make pre-dictation scripts purposeful and app-accurate"
          git push origin HEAD:course-dictation-ready-drafts
