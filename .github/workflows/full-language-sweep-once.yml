name: Full Academy language sweep once

on:
  push:
    branches:
      - course-final-direct-language-sweep
    paths:
      - .language-sweep-trigger

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONPYCACHEPREFIX: /tmp/orange-plan-academy-language-pycache

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: course-final-direct-language-sweep
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan all canonical lessons
        run: |
          set -euo pipefail
          python3 tools/full-language-sweep.py
          grep -Fq -- 'Lessons scanned: **52**' FULL-LANGUAGE-SWEEP.md

      - name: Commit the review inventory
        run: |
          set -euo pipefail
          rm -f .language-sweep-trigger
          rm -f .github/workflows/full-language-sweep-once.yml
          git config user.name 'OpenAI Course Audit'
          git config user.email 'noreply@openai.com'
          git add FULL-LANGUAGE-SWEEP.md tools/full-language-sweep.py
          git add -u .language-sweep-trigger .github/workflows/full-language-sweep-once.yml
          git commit -m 'Inventory direct-language risks across all 52 lessons'
          git push origin HEAD:course-final-direct-language-sweep
