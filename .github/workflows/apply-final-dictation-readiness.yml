name: Apply final dictation readiness pass

on:
  push:
    branches:
      - course-final-dictation-readiness
    paths:
      - course-finalize/RUN-APPLY

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: course-final-dictation-readiness
          fetch-depth: 0

      - name: Apply style-gate preflight
        run: python3 course-finalize/preflight.py

      - name: Apply course finalization
        run: python3 course-finalize/apply.py

      - name: Run final verification
        run: python3 course-finalize/verify.py

      - name: Remove one-time workflow and runners
        run: |
          rm -rf course-finalize
          rm -f .github/workflows/audit-final-dictation-readiness.yml
          rm -f .github/workflows/apply-final-dictation-readiness.yml

      - name: Commit finalization
        run: |
          git config user.name "OpenAI Course Finalization"
          git config user.email "noreply@openai.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Finalize core and advanced dictation package"
          git push origin HEAD:course-final-dictation-readiness
