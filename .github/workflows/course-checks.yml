name: Course checks

on:
  pull_request:
  push:
    branches:
      - main
      - course-v1-alignment-direct-voice

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile durable course tools
        run: |
          python3 -m py_compile \
            tools/rebuild-masters-from-scripts.py \
            tools/sync-lesson-text.py \
            tools/direct-voice-audit.py \
            tools/check-v1-course-alignment.py \
            tools/write-v1-claim-registry.py \
            tools/write-production-checklist-template.py

      - name: Regenerate derived course layers
        run: |
          set -euo pipefail
          python3 tools/rebuild-masters-from-scripts.py
          python3 tools/write-v1-claim-registry.py
          python3 tools/sync-lesson-text.py
          python3 tools/build-module-gates.py
          python3 tools/split-modules.py
          python3 tools/split-modules.py --advanced
          python3 tools/build-onefile.py
          python3 tools/build-dictation-order.py
          python3 tools/build-film-order.py
          python3 tools/build-shoot-list.py
          python3 tools/write-production-checklist-template.py
          python3 tools/build-production-checklist.py
          python3 tools/build-circle-structure.py
          python3 tools/direct-voice-audit.py --fail-ordinary

      - name: Confirm generated layers are committed
        run: git diff --exit-code

      - name: Verify V1 product contract
        run: python3 tools/check-v1-course-alignment.py

      - name: Verify cross references
        run: python3 tools/check-crossrefs.py

      - name: Verify visual references
        run: python3 tools/check-visuals.py

      - name: Verify layer parity
        run: python3 tools/check-layer-parity.py -v

      - name: Run cold-read audit
        run: python3 tools/cold-read-audit.py

      - name: Run course metrics
        run: python3 tools/course-metrics.py
