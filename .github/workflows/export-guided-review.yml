name: Export guided course review
on:
  push:
    branches: [course-guided-build-recut]
    paths: [.github/workflows/export-guided-review.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export committed tree only
        run: |
          git rev-parse HEAD > REVIEW-COMMIT.txt
          git archive --format=zip HEAD -o academy-guided-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: academy-guided-review
          path: |
            academy-guided-source.zip
            REVIEW-COMMIT.txt
          retention-days: 3
