name: Promote and verify guided Academy course
on:
  push:
    branches: [course-guided-build-recut]
    paths: [.github/workflows/finish-guided-course.yml]
permissions:
  contents: write
concurrency:
  group: academy-guided-promotion
  cancel-in-progress: false
jobs:
  promote:
    if: github.repository == 'azeltwanger/orange-plan-academy-course' && github.ref == 'refs/heads/course-guided-build-recut'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Guard the exact reviewed input and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'azeltwanger/orange-plan-academy-course'
          test "$GITHUB_REF" = 'refs/heads/course-guided-build-recut'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'd1e1a3bcd3601cd41595ab172a0a69e0e7434d28'
          test ! -e COURSE-MANIFEST.json
          test "$(git hash-object tools/guided_course.py)" = 'd2959cfa271bb13244c5387bded5367bf32c8241'
          test "$(git hash-object tools/editorial-amendments.json)" = '2e3bb7436f98c9e4842c443d5c1bfdb027f2d4ce'
          test "$(git hash-object tools/guided-support.json)" = '550d567cf3179052ceb88aad51e99a5e2ea5b7c1'
      - name: Promote scripts and prove complete synchronized outputs
        shell: bash
        run: |
          set -euo pipefail
          python tools/guided_course.py promote | tee "$RUNNER_TEMP/academy-checks.txt"
          python tools/guided_course.py test | tee -a "$RUNNER_TEMP/academy-checks.txt"
          echo '3686ff0235a5dbd241b494408421b8b2de5e5fee5d86f1a849f2d4790b9ce57e  COURSE-MANIFEST.json' | sha256sum --check
          echo 'db8afc2d15210dc0c42b2b11be321533aa0131f06527ee6c15b99dc517211bee  ARITHMETIC-CHECKS.json' | sha256sum --check
          python - <<'PY'
          import json, os
          from pathlib import Path
          log = Path(os.environ['RUNNER_TEMP'], 'academy-checks.txt').read_text()
          manifest = json.loads(Path('COURSE-MANIFEST.json').read_text())
          text = '# Guided-course verification\n\n'
          text += 'Scope: Academy course text, synchronized reading layers, fixture arithmetic and source preservation. No application engine, provider, hosted data, deployment or Production operation.\n\n'
          text += 'Reviewed source: `2343e6dc7a21b4ce6edf8e170a1890bc3cb70c9b`.\n\n'
          text += 'Compiler commit: `' + os.environ['GITHUB_SHA'] + '`.\n\n'
          text += 'Counts: 51 core teaching clips, 15 conditional Advanced clips, 10 app working sessions and 1 device demonstration.\n\n'
          text += 'Canonical manifest SHA-256: `3686ff0235a5dbd241b494408421b8b2de5e5fee5d86f1a849f2d4790b9ce57e`. It matches the locally reviewed candidate.\n\n'
          text += '```text\n' + log.rstrip() + '\n```\n\n'
          text += 'All 255 preceding active files are preserved and hash-checked. Source-material files remain unchanged. Historical whitespace is preserved rather than rewritten.\n\n'
          text += 'Ready for Austin dictation and editorial approval. App captures, device proof and marked professional-content publication gates remain open. PR #13 stays Draft; this check does not authorize a merge or launch.\n'
          Path('COURSE-VERIFICATION.md').write_text(text)
          PY
      - name: Check changes and publish only to the course branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          test -z "$(git diff --cached --name-only -- source-material .github)"
          git diff --cached --check -- . ':(exclude)archive/**'
          python - <<'PY'
          import subprocess
          from pathlib import PurePosixPath
          paths = subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          allowed = ('scripts/','modules/','lesson-text/','teleprompter/','toolkit/','fixtures/','visuals/','alignment-pass/','research/','tools/','course-v2/','archive/pre-guided-promotion/')
          for path in filter(None, paths):
              root_doc = '/' not in path and PurePosixPath(path).suffix in ('.md','.json')
              if not root_doc and not path.startswith(allowed):
                  raise SystemExit('Out-of-scope change: '+path)
          PY
          git fetch origin refs/heads/course-guided-build-recut
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish canonical guided Academy scripts and dictation package'
          git push origin HEAD:refs/heads/course-guided-build-recut
          test "$(git ls-remote origin refs/heads/course-guided-build-recut | cut -f1)" = "$(git rev-parse HEAD)"
          python tools/guided_course.py check | tee -a "$RUNNER_TEMP/academy-checks.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/ACADEMY-COMMIT.txt"
          git archive --format=zip HEAD -o "$RUNNER_TEMP/academy-verified-course.zip"
          cat COURSE-VERIFICATION.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: academy-guided-verified
          path: |
            ${{ runner.temp }}/academy-verified-course.zip
            ${{ runner.temp }}/ACADEMY-COMMIT.txt
            ${{ runner.temp }}/academy-checks.txt
          retention-days: 7
