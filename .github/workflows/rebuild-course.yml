name: Rebuild course from decks

on:
  push:
    branches:
      - course-slide-deck-flow-reset
    paths:
      - course-rebuild/RUN

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: course-slide-deck-flow-reset
          fetch-depth: 0
      - name: Restore the approved Week 3 and Week 4 numbering
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('course-rebuild/core_b.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('    "3.1": {', '    "__DEBT__": {', 1)
          text = text.replace('    "4.1": {', '    "3.1": {', 1)
          text = text.replace('    "4.2": {', '    "3.2": {', 1)
          text = text.replace('    "4.3": {', '    "3.3": {', 1)
          text = text.replace('    "4.4": {', '    "3.4": {', 1)
          text = text.replace('    "__DEBT__": {', '    "4.1": {', 1)
          text = text.replace(
              'This is why Debt comes before Allocation in the current course.',
              'Week 3 saves this rung provisionally because Debt is taught next.',
              1,
          )
          path.write_text(text, encoding='utf-8')

          walk = Path('course-rebuild/walkthroughs_b.py')
          walk_text = walk.read_text(encoding='utf-8').replace(
              'The Extra debt row is provisional until Week 4.',
              'Extra debt is provisional until Week 4.',
              1,
          )
          walk.write_text(walk_text, encoding='utf-8')
          PY
      - name: Apply rebuild
        run: python3 course-rebuild/apply.py
      - name: Verify rebuilt course
        run: |
          python3 course-rebuild/verify.py
          git diff --check
      - name: Remove temporary rebuild machinery
        run: |
          rm -rf course-rebuild
          rm -f .github/workflows/rebuild-course.yml
      - name: Commit rebuilt course
        run: |
          git config user.name "OpenAI Course Rebuild"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "Rebuild and finalize course for filming"
          git push origin HEAD:course-slide-deck-flow-reset
