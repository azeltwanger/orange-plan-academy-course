name: Read pinned Academy source for consolidation
on:
  push:
    branches: [course-consolidate-25-plus-8-20260909]
    paths: [.github/workflows/_consolidate-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'azeltwanger/orange-plan-academy-course'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c4c55601dfdaa893343623a75f478cbbfef120ad
          fetch-depth: 0
          persist-credentials: false
      - name: Archive tracked course sources only
        run: |
          set -eu
          mkdir -p /tmp/academy-source
          git archive --format=tar HEAD > /tmp/academy-source/source.tar
          git rev-parse HEAD > /tmp/academy-source/COMMIT.txt
          sha256sum /tmp/academy-source/source.tar > /tmp/academy-source/SHA256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Academy-Consolidation-Source
          path: /tmp/academy-source
          retention-days: 3
          if-no-files-found: error
