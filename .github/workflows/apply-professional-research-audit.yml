name: Apply professional research audit

on:
  push:
    branches:
      - course-austin-voice-research-final
    paths:
      - course-research-audit/RUN

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: course-austin-voice-research-final
          fetch-depth: 0

      - name: Apply parity and Austin-voice preflight
        run: python3 course-research-audit/preflight.py

      - name: Apply researched corrections
        run: python3 course-research-audit/apply.py

      - name: Regenerate and verify
        run: python3 course-research-audit/verify.py

      - name: Remove one-time files
        run: |
          rm -rf course-research-audit
          rm -f .github/workflows/apply-professional-research-audit.yml

      - name: Commit research audit
        run: |
          git config user.name "OpenAI Course Research Audit"
          git config user.email "noreply@openai.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply researched corrections before Austin voice pass"
          git push origin HEAD:course-austin-voice-research-final
