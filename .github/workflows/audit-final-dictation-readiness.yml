name: Audit final dictation readiness

on:
  push:
    branches:
      - course-final-dictation-readiness
    paths:
      - course-finalize/RUN-AUDIT

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: course-final-dictation-readiness
          fetch-depth: 0

      - name: Build dictation-readiness audit
        run: python3 course-finalize/audit.py

      - name: Commit audit
        run: |
          git config user.name "OpenAI Course Finalization"
          git config user.email "noreply@openai.com"
          git add ADVANCED-DICTATION-AUDIT.md
          if git diff --cached --quiet; then
            echo "No audit changes"
            exit 0
          fi
          git commit -m "Audit advanced lessons and dictation readiness"
          git push origin HEAD:course-final-dictation-readiness
