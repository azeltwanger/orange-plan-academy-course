name: Apply source-based course technical checks
on:
  push:
    branches: [course-professional-topic-checks-20260908]
    paths: [.github/workflows/_professional-check-pass.yml]
permissions:
  contents: read
concurrency:
  group: academy-professional-topic-checks-20260908
  cancel-in-progress: false
jobs:
  review:
    if: github.repository == 'azeltwanger/orange-plan-academy-course' && github.ref == 'refs/heads/course-professional-topic-checks-20260908'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply bounded corrections and run existing checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '62b79a0121ab663a39cb9b269f2ca07e87c8590b'
          test "$(git hash-object tools/guided_course.py)" = '100dff910e320e37ea5091391917e603b3dab895'
          test "$(git hash-object scripts/02-3_size-the-reserve-for-the-job-it-has-to-do.md)" = '2c107a394a93cc877c73f011dfe37fb5ad3d94b1'
          python -m py_compile tools/_professional_check_pass.py
          python tools/_professional_check_pass.py apply
          python tools/guided_course.py build
          python tools/guided_course.py check
          python tools/guided_course.py test
          python -m unittest discover -s tests -p test_member_deliverables.py -v
          python tools/guided_course.py history
      - name: Verify preservation and publish only to review branch
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff 62b79a0121ab663a39cb9b269f2ca07e87c8590b --name-only -- source-material fixtures toolkit tests CAPTURE-RECEIPTS.md PROMOTION-RECORD.json production scripts/02-3_size-the-reserve-for-the-job-it-has-to-do.md scripts/working/W02_verify-cash-flow-set-the-reserve-and-add-expected-events.md scripts/working/D07_prove-a-wallet-backup-with-a-safe-test-setup.md scripts/working/W03_set-debt-jobs-and-test-one-financing-decision.md tools/guided_course.py ARITHMETIC-CHECKS.json)"
          git add scripts lesson-text teleprompter modules README.md FINALIZATION-STATUS.md HANDOFF.md PRIMARY-SOURCES.md delivery/professional-topic-review.md COURSE-MANIFEST.json MASTER-COURSE.md MASTER-ADVANCED.md ALL-SCRIPTS.md DICTATION-ORDER.md ADVANCED-DICTATION-ORDER.md FILM-ORDER.md CIRCLE-STRUCTURE.md SCREEN-SHOOT-LIST.md MODULE-CHECKPOINTS.md PRODUCTION-CHECKLIST.md COURSE-METRICS.md
          test -z "$(git diff --cached --name-only -- .github source-material fixtures toolkit tests CAPTURE-RECEIPTS.md PROMOTION-RECORD.json production tools/guided_course.py ARITHMETIC-CHECKS.json)"
          git diff --cached --check
          git fetch origin refs/heads/course-professional-topic-checks-20260908
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply source-checked technical qualifications and synchronize course reading copies'
          git push origin HEAD:refs/heads/course-professional-topic-checks-20260908
          test "$(git ls-remote origin refs/heads/course-professional-topic-checks-20260908 | cut -f1)" = "$(git rev-parse HEAD)"
          python tools/guided_course.py check
          git diff --exit-code
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Package current readings and independent arithmetic
        run: python tools/_professional_check_pass.py package /tmp/orange-plan-professional-review
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Orange-Plan-Technical-Review
          path: /tmp/orange-plan-professional-review
          if-no-files-found: error
          retention-days: 30
