name: Remove separate homework and keep application in the member plan
on:
  push:
    branches: [course-own-plan-no-homework-20260909]
    paths: [.github/workflows/_own-plan-application.yml]
permissions:
  contents: read
concurrency:
  group: academy-own-plan-application-20260909
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'azeltwanger/orange-plan-academy-course' && github.ref == 'refs/heads/course-own-plan-no-homework-20260909'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply the bounded owner correction and check the course
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '26be5dbabbfcfa0c95d9bcead8a41684abcf8f76'
          python -m py_compile tools/_own_plan_application.py
          python tools/_own_plan_application.py apply
          python tools/guided_course.py build
          python tools/guided_course.py check
          python tools/guided_course.py test
          python -m unittest discover -s tests -p test_member_deliverables.py -v
          python tools/guided_course.py history
      - name: Remove temporary authoring files and publish only to the review branch
        shell: bash
        run: |
          set -euo pipefail
          cp tools/_own_plan_application.py /tmp/own_plan_application.py
          git rm tools/_own_plan_application.py .github/workflows/_own-plan-application.yml
          test -z "$(git diff 26be5dbabbfcfa0c95d9bcead8a41684abcf8f76 --name-only -- .github tools source-material fixtures toolkit tests production CAPTURE-RECEIPTS.md PROMOTION-RECORD.json delivery/professional-topic-review.md scripts/02-3_size-the-reserve-for-the-job-it-has-to-do.md scripts/working/W02_verify-cash-flow-set-the-reserve-and-add-expected-events.md scripts/working/D07_prove-a-wallet-backup-with-a-safe-test-setup.md)"
          git add scripts lesson-text teleprompter modules README.md FINALIZATION-STATUS.md HANDOFF.md delivery/decision-learning-review.md delivery/decision-learning-changes.json COURSE-MANIFEST.json MASTER-COURSE.md MASTER-ADVANCED.md ALL-SCRIPTS.md DICTATION-ORDER.md ADVANCED-DICTATION-ORDER.md FILM-ORDER.md CIRCLE-STRUCTURE.md SCREEN-SHOOT-LIST.md MODULE-CHECKPOINTS.md PRODUCTION-CHECKLIST.md COURSE-METRICS.md ARITHMETIC-CHECKS.json
          git diff --cached --check
          git fetch origin refs/heads/course-own-plan-no-homework-20260909
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove separate homework and apply teaching directly in each member plan'
          git push origin HEAD:refs/heads/course-own-plan-no-homework-20260909
          test "$(git ls-remote origin refs/heads/course-own-plan-no-homework-20260909 | cut -f1)" = "$(git rev-parse HEAD)"
          python tools/guided_course.py check
          git diff --exit-code
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Export a source-matched reading copy without exercises
        run: python /tmp/own_plan_application.py export /tmp/orange-plan-own-plan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Orange-Plan-Own-Plan-Application
          path: /tmp/orange-plan-own-plan
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
