name: Clean and verify Academy dictation index once

on:
  push:
    branches:
      - course-dictation-order-final-cleanup
    paths:
      - .dictation-order-trigger

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONPYCACHEPREFIX: /tmp/orange-plan-academy-dictation-order-pycache

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: course-dictation-order-final-cleanup
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update the hand-written quick list
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('DICTATION-ORDER.md')
          text = p.read_text(encoding='utf-8')
          replacements = {
              '- **6.3 · Use plan confidence and guardrails to adjust spending** — Pre-dictation filming draft ready': '- **6.3 · Read the simulation result and use spending guardrails** — Pre-dictation filming draft ready',
              '- **7.1 · Choose a custody setup your household can recover** — Pre-dictation filming draft ready': '- **7.1 · Self-custody, professional custody, and when a split makes sense** — Pre-dictation filming draft ready',
              '- **9.2 · Test decisions separately and read the finished plan like a planner** — Pre-dictation filming draft ready': '- **9.2 · Test decisions separately and read Your Plan like a planner** — Pre-dictation filming draft ready',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected quick-list line once: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate the dictation order from current scripts
        run: |
          set -euo pipefail
          python3 tools/build-dictation-order.py

      - name: Verify the production index
        run: |
          set -euo pipefail
          grep -Fq -- '- **6.3 · Read the simulation result and use spending guardrails**' DICTATION-ORDER.md
          grep -Fq -- '- **7.1 · Self-custody, professional custody, and when a split makes sense**' DICTATION-ORDER.md
          grep -Fq -- '- **9.2 · Test decisions separately and read Your Plan like a planner**' DICTATION-ORDER.md
          grep -Fq -- '- **US-specific scope and the general disclaimer** are covered once in **0.1**.' DICTATION-ORDER.md
          grep -Fq -- '**28 teach lessons ·' DICTATION-ORDER.md
          grep -Fq -- '| 7.4 | *DEMO — Hardware-wallet recovery and exchange hardening* | — DEMO, narrated off the sheet |' DICTATION-ORDER.md
          grep -Fq -- '**7.3**' DICTATION-ORDER.md
          ! grep -Fq -- '0 times, total' DICTATION-ORDER.md
          ! grep -Fq -- '??' DICTATION-ORDER.md
          ! grep -Fq -- '**7.4**' DICTATION-ORDER.md
          python3 tools/check-crossrefs.py
          python3 tools/course-metrics.py --check
          git diff --check

      - name: Commit the verified production index
        run: |
          set -euo pipefail
          rm -f .dictation-order-trigger
          rm -f .github/workflows/dictation-order-cleanup-once.yml
          if find . -type d -name __pycache__ -o -type f -name '*.pyc' | grep -q .; then
            echo 'Python cache artifacts remain.' >&2
            exit 1
          fi
          git config user.name 'OpenAI Course Audit'
          git config user.email 'noreply@openai.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix the final Academy dictation index'
          git push origin HEAD:course-dictation-order-final-cleanup
