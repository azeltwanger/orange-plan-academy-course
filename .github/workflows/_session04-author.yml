name: Prepare individual Allocation teaching review
on:
  push:
    branches: [course-teaching-repair-session04-20260908]
    paths: [.github/workflows/_session04-author.yml]
permissions:
  contents: read
concurrency:
  group: academy-session04-individual-repair
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'azeltwanger/orange-plan-academy-course' && github.ref == 'refs/heads/course-teaching-repair-session04-20260908'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Guard source and synchronize already-written Allocation replacements
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'adc33ea217ddf857fe2e928a210ed4f118ca75f9'
          test "$(git hash-object scripts/02-3_size-the-reserve-for-the-job-it-has-to-do.md)" = '2c107a394a93cc877c73f011dfe37fb5ad3d94b1'
          python - <<'PY'
          from pathlib import Path
          edits = {
              'scripts/04-7_tell-each-account-what-to-buy-and-finish-the-outside-actions.md': [
                  ('One route to compare is $1,000 toward personally held Bitcoin and $605 toward a broad stock fund in the taxable brokerage account.', 'One route to compare is one thousand dollars toward personally held Bitcoin and six hundred five dollars toward a broad stock fund in the taxable brokerage account.'),
                  ('his workplace plan is 70% stocks and 30% Bitcoin-fund exposure.', 'his workplace plan is seventy percent stocks and thirty percent Bitcoin-fund exposure.'),
                  ('His Roth IRA is 20% stocks and 80% Bitcoin-fund exposure.', 'His Roth IRA is twenty percent stocks and eighty percent Bitcoin-fund exposure.'),
              ],
              'scripts/04-3_match-the-money-to-when-you-will-use-it.md': [
                  ('Alex would like work to become optional at 52. Age 59½ is about seven and a half years later.', 'Alex would like work to become optional at fifty-two. Age fifty-nine and a half is about seven and a half years later.'),
              ],
          }
          for name, pairs in edits.items():
              p = Path(name)
              text = p.read_text()
              for old, new in pairs:
                  if text.count(old) != 1:
                      raise ValueError('Unexpected source for spoken-number correction')
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')
          PY
          python tools/_prepare_session04_repair.py
          python -m py_compile tools/guided_course.py
          python tools/guided_course.py build
          python tools/guided_course.py check
          python tools/guided_course.py test
          python -m unittest discover -s tests -p test_member_deliverables.py -v
          python tools/guided_course.py history
      - name: Verify preservation and publish only to the dedicated repair branch
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff 3e54ae3fe2249d588e29d74646c9fae01d1655f9 --name-only -- source-material fixtures toolkit tests CAPTURE-RECEIPTS.md PROMOTION-RECORD.json production 'scripts/02-*' 'scripts/03-*' scripts/working/W02_verify-cash-flow-set-the-reserve-and-add-expected-events.md scripts/working/W03_set-debt-jobs-and-test-one-financing-decision.md)"
          git add scripts lesson-text teleprompter modules README.md FINALIZATION-STATUS.md HANDOFF.md tools/guided_course.py COURSE-MANIFEST.json MASTER-COURSE.md MASTER-ADVANCED.md ALL-SCRIPTS.md DICTATION-ORDER.md ADVANCED-DICTATION-ORDER.md FILM-ORDER.md CIRCLE-STRUCTURE.md SCREEN-SHOOT-LIST.md MODULE-CHECKPOINTS.md PRODUCTION-CHECKLIST.md COURSE-METRICS.md ARITHMETIC-CHECKS.json
          test -z "$(git diff --cached --name-only -- .github source-material fixtures toolkit tests CAPTURE-RECEIPTS.md PROMOTION-RECORD.json production 'scripts/02-*' 'scripts/03-*' scripts/working/W02_verify-cash-flow-set-the-reserve-and-add-expected-events.md scripts/working/W03_set-debt-jobs-and-test-one-financing-decision.md)"
          git diff --cached --check
          git fetch origin refs/heads/course-teaching-repair-session04-20260908
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Synchronize Allocation replacement reading copies and accurate repair progress'
          git push origin HEAD:refs/heads/course-teaching-repair-session04-20260908
          test "$(git ls-remote origin refs/heads/course-teaching-repair-session04-20260908 | cut -f1)" = "$(git rev-parse HEAD)"
          python tools/guided_course.py check
          git diff --exit-code
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
