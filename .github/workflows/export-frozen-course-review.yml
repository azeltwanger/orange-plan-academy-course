name: Export frozen Academy review snapshot
on:
  push:
    branches: [course-finish-review-20260907]
    paths: [.github/workflows/export-frozen-course-review.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2343e6dc7a21b4ce6edf8e170a1890bc3cb70c9b
          persist-credentials: false
      - name: Package exact reviewed source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2343e6dc7a21b4ce6edf8e170a1890bc3cb70c9b"
          git archive --format=zip --output=academy-review-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: academy-frozen-review-2343e6
          path: academy-review-source.zip
          retention-days: 3
